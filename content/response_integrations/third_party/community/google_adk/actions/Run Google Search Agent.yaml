name: Run Google Search Agent
description: Specialized OSINT researcher agent powered by Google ADK. Performs real-time,
  context-aware threat intelligence and open-web security research using Google Search
  grounding.
integration_identifier: GoogleADK
parameters:
- name: User Prompt
  type: string
  is_mandatory: true
  default_value: What is today's cyber security news?
  description: The OSINT or security investigation query to search the web for.
  display_name: User Prompt
- name: Thinking Budget
  type: string
  is_mandatory: false
  default_value: '1024'
  description: Thinking budget (token count) for model reasoning (e.g. 1024).
  display_name: Thinking Budget
- name: Enable Memory
  type: boolean
  is_mandatory: false
  default_value: false
  description: Whether to equip the agent with persistent long-term memory via Vertex
    AI Memory Bank.
  display_name: Enable Memory
- name: Session ID
  type: string
  is_mandatory: false
  default_value: ''
  description: Optional session identifier to scope memory context. Defaults to active
    case ID (case_<CaseId>).
  display_name: Session ID
dynamic_results_metadata:
- result_example_path: resources/Run Google Search Agent_JsonResult_example.json
  result_name: JsonResult
  show_result: true
creator: Christopher Martin
