name: Run Hosted MCP ADK Agent
description: Launches a Google ADK Agent integrated with a Google-hosted Model Context
  Protocol (MCP) server. Equips the agent with dynamic OAuth credentials to query
  external tools and fetch procedural runbooks from Google Cloud Storage. Returns
  reasoning thoughts, executed tool calls, and final findings directly to the Case
  Wall and programmatic JSON outputs.
integration_identifier: GoogleADK
parameters:
- name: User Prompt
  type: string
  is_mandatory: true
  default_value: What MCP Tools are available?
  description: The prompt or security investigation instruction for the MCP-enabled
    agent.
  display_name: User Prompt
- name: Thinking Budget
  type: string
  is_mandatory: false
  default_value: '1024'
  description: Thinking budget (token count) for model reasoning (e.g. 1024).
  display_name: Thinking Budget
- name: Tool Filter
  type: string
  is_mandatory: false
  default_value: udm_search, translate_udm_query
  description: Comma-separated whitelist of specific MCP tools to make available to
    the agent (e.g. 'udm_search, translate_udm_query').
  display_name: Tool Filter
- name: Enable Memory
  type: boolean
  is_mandatory: false
  default_value: false
  description: Whether to equip the agent with persistent long-term memory via Vertex
    AI Memory Bank.
  display_name: Enable Memory
- name: Session ID
  type: string
  is_mandatory: false
  default_value: ''
  description: Optional session identifier to scope memory context. Defaults to active
    case ID (case_<CaseId>).
  display_name: Session ID
dynamic_results_metadata:
- result_example_path: resources/Run Hosted MCP ADK Agent_JsonResult_example.json
  result_name: JsonResult
  show_result: true
creator: Christopher Martin
