name: Run ADK Skill Registry Agent
description: Executes a Google ADK Agent equipped with procedural security runbooks
  and dynamic toolsets fetched directly from the Google Cloud Skill Registry.
integration_identifier: GoogleADK
parameters:
- name: User Prompt
  type: string
  is_mandatory: true
  default_value: Run triage investigation playbook
  description: The query or task instruction for the skill registry agent.
  display_name: User Prompt
- name: Thinking Budget
  type: string
  is_mandatory: false
  default_value: '1024'
  description: Thinking budget for reasoning models (e.g. 1024).
  display_name: Thinking Budget
- name: Enable Memory
  type: boolean
  is_mandatory: false
  default_value: false
  description: Whether to equip the agent with persistent long-term memory via Vertex
    AI Memory Bank.
  display_name: Enable Memory
- name: Session ID
  type: string
  is_mandatory: false
  default_value: ''
  description: Optional session identifier to scope memory context. Defaults to active
    case ID (case_<CaseId>).
  display_name: Session ID
dynamic_results_metadata:
- result_example_path: resources/Run ADK Skill Registry Agent_JsonResult_example.json
  result_name: JsonResult
  show_result: true
creator: Christopher Martin
